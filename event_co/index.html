<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Coordinator Login</title>
<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:linear-gradient(135deg,#4facfe,#00f2fe);
    }

    .login-box{
        background:#fff;
        padding:40px;
        width:350px;
        border-radius:15px;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
    }

    .login-box h2{
        text-align:center;
        margin-bottom:25px;
        color:#333;
    }

    .input-group{
        margin-bottom:20px;
    }

    .input-group label{
        display:block;
        margin-bottom:8px;
        font-weight:bold;
        color:#555;
    }

    .input-group input{
        width:100%;
        padding:12px;
        border:1px solid #ccc;
        border-radius:8px;
        outline:none;
        transition:0.3s;
    }

    .input-group input:focus{
        border-color:#4facfe;
    }

    .btn{
        width:100%;
        padding:12px;
        border:none;
        background:#4facfe;
        color:#fff;
        font-size:16px;
        border-radius:8px;
        cursor:pointer;
        transition:0.3s;
    }

    .btn:hover{
        background:#007bff;
    }

    .footer{
        text-align:center;
        margin-top:15px;
        font-size:14px;
    }

    .footer a{
        text-decoration:none;
        color:#4facfe;
    }
</style>
</head>
<body>

<div class="login-box">
    <h2>Event Coordinator Login</h2>

    <form action="../main.php?flag=6" method="POST">
        <div class="input-group">
            <label>Email</label>
            <input type="email" name="coord_email" value="" placeholder="Enter email" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" name="coord_pass" value="" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn">Login</button>

    </form>
</div>

</body>
</html>
